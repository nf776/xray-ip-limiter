# Docker-compose файл для деплоя главного сервиса + агента на одной ноде

services:
  nats:
    image: nats:latest
    container_name: "xray-ip-limiter-nats"
    ports:
      - "127.0.0.1:4222:4222"
    command: ["-js", "--auth", "CHANGE_ME"] # Можно оставить CHANGE_ME если закрыты порты NATS
    networks:
      - observer
    volumes:
      - nats-data:/data

  redis:
    image: valkey/valkey:8.0
    container_name: xray-ip-limiter-redis
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - observer
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  xray-ip-limiter:
    image: ghcr.io/nf776/xray-ip-limiter:latest
    container_name: xray-ip-limiter
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    volumes:
      - ./config-limiter-local.yaml:/app/config.yaml:ro
    networks:
      - observer

  xray-ip-limiter-agent:
    image: ghcr.io/nf776/xray-ip-limiter-agent:latest
    container_name: xray-ip-limiter-agent
    restart: always
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./config-agent-local.yaml:/app/config.yaml:ro
      - /var/log/remnanode:/var/log/remnanode

networks:
  observer:
    driver: bridge

volumes:
  redis-data:
  nats-data:
